services:
  shreeji-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shreeji-server-247
    restart: always # Ensures container runs 24/7 and auto-restarts on reboot or crash
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=*
      - CACHE_TTL_SECONDS=60
      - STORAGE_PROVIDER=local
      # Set DATABASE_URL and Cloud Storage credentials via environment or .env
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
